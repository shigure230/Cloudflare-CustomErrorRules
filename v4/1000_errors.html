<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Cloudflare error</title>
<style>
  :root{
    --bg:#0d0d0f;
    --bg-2:#151518;
    --ink:#e9e6df;
    --muted:#8a857c;
    --accent:#ff8a3d;
    --accent-soft:rgba(255,138,61,.14);
    --danger:#ff5a4d;
    --line:rgba(255,255,255,.07);
    --mono:"IBM Plex Mono","SF Mono","JetBrains Mono","PingFang SC","Hiragino Sans","Hiragino Kaku Gothic ProN","Microsoft YaHei","Yu Gothic",ui-monospace,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--mono);
    min-height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    overflow:hidden;
    padding:32px 24px;
    padding-top:max(32px,env(safe-area-inset-top));
    padding-bottom:max(32px,env(safe-area-inset-bottom));
  }
  body::before{
    content:"";
    position:absolute;
    inset:0;
    background-image:
      linear-gradient(var(--line) 1px,transparent 1px),
      linear-gradient(90deg,var(--line) 1px,transparent 1px);
    background-size:42px 42px;
    mask-image:radial-gradient(circle at 50% 42%,#000 0%,rgba(0,0,0,.35) 55%,transparent 80%);
    -webkit-mask-image:radial-gradient(circle at 50% 42%,#000 0%,rgba(0,0,0,.35) 55%,transparent 80%);
  }
  body::after{
    content:"";
    position:absolute;
    width:680px;height:680px;
    top:-180px;left:50%;
    transform:translateX(-50%);
    background:radial-gradient(circle,var(--accent-soft) 0%,transparent 65%);
    pointer-events:none;
  }
  .wrap{
    position:relative;
    z-index:2;
    text-align:center;
    max-width:580px;
    animation:rise .8s cubic-bezier(.2,.7,.2,1) both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
  .tag{
    display:inline-block;
    font-size:12px;
    letter-spacing:.32em;
    text-transform:uppercase;
    color:var(--accent);
    border:1px solid var(--accent-soft);
    background:var(--accent-soft);
    padding:6px 14px;
    border-radius:999px;
    margin-bottom:28px;
  }
  .num{
    font-size:clamp(56px,15vw,130px);
    font-weight:700;
    line-height:.9;
    letter-spacing:.02em;
    position:relative;
    display:inline-block;
    color:var(--ink);
    text-shadow:0 0 40px rgba(255,138,61,.25);
  }
  .num span{color:var(--accent)}
  .num::before,.num::after{
    content:attr(data-code);
    position:absolute;
    inset:0;
    opacity:.55;
  }
  .num::before{color:#3dd7ff;animation:g1 4s infinite steps(2)}
  .num::after{color:var(--accent);animation:g2 5.5s infinite steps(2)}
  @keyframes g1{0%,92%,100%{transform:none;opacity:0}93%{transform:translate(-3px,1px);opacity:.4}96%{transform:translate(2px,-1px);opacity:.4}}
  @keyframes g2{0%,90%,100%{transform:none;opacity:0}91%{transform:translate(2px,-2px);opacity:.35}97%{transform:translate(-2px,2px);opacity:.35}}
  h1{font-size:clamp(20px,4.6vw,26px);font-weight:700;margin:24px 0 12px;letter-spacing:.01em}
  p.desc{font-size:14.5px;line-height:1.7;color:var(--muted);max-width:460px;margin:0 auto 34px}
  .home{
    display:inline-flex;align-items:center;gap:10px;
    text-decoration:none;color:var(--bg);background:var(--accent);
    font-family:var(--mono);font-weight:600;font-size:14px;letter-spacing:.02em;
    padding:13px 26px;border-radius:10px;
    transition:transform .18s ease,box-shadow .18s ease,background .18s ease;
    box-shadow:0 8px 30px rgba(255,138,61,.28);
  }
  .home:hover{transform:translateY(-2px);box-shadow:0 12px 38px rgba(255,138,61,.4);background:#ffa15e}
  .home .arrow{transition:transform .18s ease}
  .home:hover .arrow{transform:translateX(4px)}
  .meta{
    display:flex;flex-wrap:wrap;justify-content:center;gap:10px 26px;
    font-size:12.5px;color:var(--muted);
    border-top:1px solid var(--line);padding-top:24px;margin-top:38px;margin-bottom:8px;
  }
  .meta .k{color:rgba(255,255,255,.35);margin-right:7px;letter-spacing:.04em}
  .meta .v{color:var(--ink)}
  .contact{margin-top:22px;font-size:13px;color:var(--muted)}
  .contact a{color:var(--accent);text-decoration:none}
  .contact a:hover{text-decoration:underline}
</style>
<meta name="theme-color" content="#f4efe5">
<script>
(function () {
  var theme;
  try {
    var saved = localStorage.getItem('preferredTheme');
    if (saved === 'light' || saved === 'dark') theme = saved;
  } catch (e) {}
  if (!theme) {
    theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  document.documentElement.setAttribute('data-theme', theme);
  document.documentElement.style.colorScheme = theme;
  var meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', theme === 'light' ? '#f4efe5' : '#0d0d0f');
})();
</script>
<style id="hefan-theme">
  /* Light palette — variant A (paper). Dark keeps the original Cloudflare look. */
  :root{
    --bg:#f4efe5;
    --bg-2:#fffdf7;
    --ink:#241f18;
    --muted:#6c6357;
    --accent:#b8480c;
    --accent-hover:#963a07;
    --accent-soft:rgba(184,72,12,.12);
    --on-accent:#fffaf2;
    --danger:#b3261e;
    --line:rgba(36,31,24,.10);
    --faint:rgba(36,31,24,.38);
    --glow:rgba(184,72,12,.16);
    --shadow:rgba(70,45,20,.16);
    --glitch:#0e7490;
    --shield-glow:rgba(156,68,7,.18);
  }
  :root[data-theme="dark"]{
    --bg:#0d0d0f;
    --bg-2:#151518;
    --ink:#e9e6df;
    --muted:#8a857c;
    --accent:#ff8a3d;
    --accent-hover:#ffa15e;
    --accent-soft:rgba(255,138,61,.14);
    --on-accent:#0d0d0f;
    --danger:#ff5a4d;
    --line:rgba(255,255,255,.07);
    --faint:rgba(255,255,255,.35);
    --glow:rgba(255,138,61,.25);
    --shadow:rgba(255,138,61,.28);
    --glitch:#3dd7ff;
    --shield-glow:rgba(255,138,61,.35);
  }

  html{overflow-x:hidden;background-color:var(--bg)}
  body{overflow-y:auto;overflow-x:hidden}
  /* iOS: keep the top edge flat so the status bar / theme-color matches the body */
  body::after{top:0}
  .wrap{margin:auto 0}

  /* Keep the status tag above the code, not inline next to it. */
  .tag{display:block;width:fit-content;margin:0 auto 28px}

  .num{text-shadow:0 0 40px var(--glow)}
  .num::before{color:var(--glitch)}
  .home{color:var(--on-accent);background:var(--accent);box-shadow:0 8px 30px var(--shadow)}
  .home:hover{background:var(--accent-hover);box-shadow:0 12px 38px var(--shadow)}
  .meta .k{color:var(--faint)}
  .shield svg{filter:drop-shadow(0 0 26px var(--shield-glow))}

  /* Top-right circle: theme toggle only */
  .controls{
    position:fixed;
    top:max(22px,env(safe-area-inset-top));
    right:max(22px,env(safe-area-inset-right));
    z-index:5;
    display:flex;
    align-items:center;
    gap:2px;
    padding:4px;
    background:var(--bg-2);
    border:1px solid var(--line);
    border-radius:999px;
  }

  .theme-toggle{
    width:32px;height:32px;padding:0;
    display:inline-flex;align-items:center;justify-content:center;
    background:transparent;
    border:0;
    border-radius:999px;
    color:var(--muted);
    cursor:pointer;
    transition:color .15s ease,background .15s ease;
  }
  .theme-toggle:hover{color:var(--ink);background:var(--accent-soft)}
  .theme-toggle svg{width:17px;height:17px;display:block}
  .theme-toggle .icon-sun{display:none}
  :root[data-theme="dark"] .theme-toggle .icon-sun{display:block}
  :root[data-theme="dark"] .theme-toggle .icon-moon{display:none}

  /* Variant A decorations — light only */
  :root:not([data-theme="dark"]) body::before{background-size:34px 34px}
  :root:not([data-theme="dark"]) .tag{
    border-style:dashed;
    border-radius:4px;
    letter-spacing:.24em;
  }
  :root:not([data-theme="dark"]) .num{text-shadow:0 2px 0 #fff}
  :root:not([data-theme="dark"]) .home{
    border-radius:4px;
    box-shadow:4px 4px 0 var(--ink);
  }
  :root:not([data-theme="dark"]) .home:hover{
    transform:translate(-1px,-3px);
    box-shadow:6px 7px 0 var(--ink);
  }
  :root:not([data-theme="dark"]) .meta{border-top-style:dashed}

  @media (max-width:480px){
    .controls{
      top:max(16px,env(safe-area-inset-top));
      right:max(16px,env(safe-area-inset-right));
    }
    .theme-toggle{width:40px;height:40px}
  }
  @media (max-width:768px),(max-height:680px){
    body{padding-top:max(88px,calc(env(safe-area-inset-top) + 72px))}
  }
  @media (prefers-reduced-motion:reduce){
    .wrap{animation:none}
    .num::before,.num::after{animation:none}
    *{transition:none !important}
  }
</style>
</head>
<body>

  <div class="controls">
    <button type="button" class="theme-toggle" id="themeToggle" aria-label="Switch to dark mode">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4"></circle>
        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path>
      </svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path>
      </svg>
    </button>
  </div>

  <main class="wrap">
    <span class="tag" data-i18n="tag">CF ERROR</span>
    <div class="num" id="num" data-code="10XX" aria-hidden="true">10<span>X</span>X</div>
    <h1 data-i18n="title">Cloudflare error</h1>
    <p class="desc" id="desc" data-i18n="desc">Cloudflare was unable to complete your request due to a configuration or network issue.</p>

    <button class="home" type="button" onclick="location.reload()">
      <span data-i18n="retry">Try again later</span>
      <span class="arrow">&#8635;</span>
    </button>

    <div class="meta" id="meta" style="display:none">
      <span id="mi-ip"><span class="k" data-i18n="ip">Your IP</span><span class="v" id="m-ip">::CLIENT_IP::</span></span>
      <span id="mi-ray"><span class="k">Ray ID</span><span class="v" id="m-ray">::RAY_ID::</span></span>
      <span id="mi-geo"><span class="k" data-i18n="geo">Location</span><span class="v" id="m-geo">::GEO::</span></span>
    </div>

    <p class="contact" data-i18n="contact">Still having issues? Email <a href="mailto:admin@eqi.me">admin@eqi.me</a>.</p>
  </main>

  <div id="cfbox" style="display:none">::CLOUDFLARE_ERROR_1000S_BOX::</div>

<script>
  var i18n = {
    zh:{
      lang:"zh-CN", tag:"CF 错误", title:"Cloudflare 错误",
      desc:"Cloudflare 因配置或网络问题无法完成你的请求。",
      retry:"稍后重试", ip:"你的 IP", geo:"地区",
      contact:'仍有问题？请联系 <a href="mailto:admin@eqi.me">admin@eqi.me</a>。'
    },
    ja:{
      lang:"ja", tag:"CF エラー", title:"Cloudflare エラー",
      desc:"設定またはネットワークの問題により、Cloudflare がリクエストを完了できませんでした。",
      retry:"後でもう一度試す", ip:"あなたのIP", geo:"地域",
      contact:'問題が続く場合は <a href="mailto:admin@eqi.me">admin@eqi.me</a> までご連絡ください。'
    },
    en:{
      lang:"en", tag:"CF ERROR", title:"Cloudflare error",
      desc:"Cloudflare was unable to complete your request due to a configuration or network issue.",
      retry:"Try again later", ip:"Your IP", geo:"Location",
      contact:'Still having issues? Email <a href="mailto:admin@eqi.me">admin@eqi.me</a>.'
    }
  };

  var reasons = {
    zh:{
      1000:"DNS 指向了被禁止的 IP 地址。",
      1001:"DNS 解析失败，无法解析域名。",
      1002:"访问受限，该域名不可使用。",
      1003:"不允许直接通过 IP 地址访问。",
      1004:"该主机未配置为服务 Web 流量。",
      1010:"本站所有者已基于浏览器特征禁止你的访问。",
      1011:"拒绝访问：不允许盗链资源。",
      1012:"访问被拒绝。",
      1013:"HTTP 主机名与 TXT 记录主机名不匹配。",
      1016:"源站 DNS 解析出错。",
      1018:"无法找到该主机。",
      1019:"Cloudflare 服务器计算错误。",
      1020:"根据防火墙规则，访问被拒绝。",
      1023:"无法找到该主机。"
    },
    ja:{
      1000:"DNS が禁止された IP アドレスを指しています。",
      1001:"DNS の解決に失敗しました。",
      1002:"このドメインへのアクセスは制限されています。",
      1003:"IP アドレスによる直接アクセスは許可されていません。",
      1004:"このホストは Web トラフィックを提供するよう設定されていません。",
      1010:"サイト所有者がブラウザの特徴に基づきアクセスをブロックしました。",
      1011:"ホットリンクは禁止されています。",
      1012:"アクセスが拒否されました。",
      1013:"HTTP ホスト名と TXT レコードのホスト名が一致しません。",
      1016:"オリジンの DNS エラーです。",
      1018:"ホストが見つかりません。",
      1019:"Cloudflare サーバーでエラーが発生しました。",
      1020:"ファイアウォールルールによりアクセスが拒否されました。",
      1023:"ホストが見つかりません。"
    },
    en:{
      1000:"The DNS points to a prohibited IP address.",
      1001:"DNS resolution error — the domain could not be resolved.",
      1002:"Access is restricted for this domain.",
      1003:"Direct IP access is not allowed.",
      1004:"The host is not configured to serve web traffic.",
      1010:"The site owner has blocked access based on your browser signature.",
      1011:"Access denied: hotlinking is not allowed.",
      1012:"Access denied.",
      1013:"The HTTP hostname and TXT record hostname do not match.",
      1016:"Origin DNS error.",
      1018:"The host could not be found.",
      1019:"Cloudflare compute server error.",
      1020:"Access denied by a firewall rule.",
      1023:"The host could not be found."
    }
  };

  var info = {};

  function parseCfBox(){
    var box = document.getElementById("cfbox");
    var txt = box ? (box.textContent || "") : "";
    var out = {}, m;
    if((m = txt.match(/Error reference number:\s*(\d{4})/i))) out.code = m[1];
    else if((m = txt.match(/\b(1\d{3})\b/))) out.code = m[1];
    return out;
  }

  function setCode(code){
    if(!code) return;
    var num = document.getElementById("num");
    num.setAttribute("data-code", code);
    var chars = code.split(""), html = "";
    for(var i=0;i<chars.length;i++){
      html += (i===2) ? "<span>"+chars[i]+"</span>" : chars[i];
    }
    num.innerHTML = html;
  }

  function tokenVal(id){
    var v=(document.getElementById(id).textContent||"").trim();
    return(v&&v.indexOf("::")===-1)?v:"";
  }
  function fillMeta(valId,itemId,val){
    if(val){document.getElementById(valId).textContent=val;return true;}
    document.getElementById(itemId).style.display="none";
    return false;
  }

  function pickLang(){
    var list=navigator.languages&&navigator.languages.length?navigator.languages:[navigator.language||"en"];
    for(var i=0;i<list.length;i++){
      var code=(list[i]||"").toLowerCase();
      if(code.indexOf("zh")===0)return"zh";
      if(code.indexOf("ja")===0)return"ja";
      if(code.indexOf("en")===0)return"en";
    }
    return"en";
  }

  function apply(lang){
    var t=i18n[lang]||i18n.en;
    document.documentElement.lang=t.lang;
    document.title=t.title;
    document.querySelectorAll("[data-i18n]").forEach(function(el){
      var k=el.getAttribute("data-i18n");
      if(!t[k])return;
      if(k==="desc"){
        if(info.code && reasons[lang][info.code]) el.textContent=reasons[lang][info.code];
        else el.textContent=t.desc;
      } else if(k==="contact"){
        el.innerHTML=t[k];
      } else {
        el.textContent=t[k];
      }
    });
  }

  info = parseCfBox();
  setCode(info.code);
  apply(pickLang());

  var tIp=tokenVal("m-ip"),tRay=tokenVal("m-ray"),tGeo=tokenVal("m-geo");
  ["m-ip","m-ray","m-geo"].forEach(function(id){
    if(!tokenVal(id))document.getElementById(id).textContent="";
  });

  function finishMeta(trace){
    trace=trace||{};
    var hasIp=fillMeta("m-ip","mi-ip",tIp||trace.ip);
    var hasRay=fillMeta("m-ray","mi-ray",tRay||trace.ray);
    var hasGeo=fillMeta("m-geo","mi-geo",tGeo||trace.loc);
    if(hasIp||hasRay||hasGeo)document.getElementById("meta").style.display="flex";
  }

  fetch("/cdn-cgi/trace",{cache:"no-store"})
    .then(function(r){return r.text();})
    .then(function(txt){
      var d={};
      txt.trim().split("\n").forEach(function(line){
        var i=line.indexOf("=");
        if(i>0)d[line.slice(0,i)]=line.slice(i+1);
      });
      finishMeta(d);
    })
    .catch(function(){finishMeta(null);});

</script>
<script>
(function () {
  var THEME_KEY = "preferredTheme";
  var LANG_KEY = "preferredLanguage";
  var LABELS = {
    en: ["Switch to light mode", "Switch to dark mode"],
    zh: ["切换到浅色模式", "切换到深色模式"],
    ja: ["ライトモードに切り替え", "ダークモードに切り替え"]
  };
  var button = document.getElementById("themeToggle");

  function uiLang() {
    var l = (document.documentElement.lang || "en").toLowerCase();
    if (l.indexOf("zh") === 0) return "zh";
    if (l.indexOf("ja") === 0) return "ja";
    return "en";
  }
  function getTheme() {
    return document.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light";
  }
  function syncTheme() {
    if (!button) return;
    var pair = LABELS[uiLang()] || LABELS.en;
    var isLight = getTheme() === "light";
    var label = isLight ? pair[1] : pair[0];
    button.setAttribute("aria-label", label);
    button.setAttribute("title", label);
    button.setAttribute("aria-pressed", String(isLight));
  }
  function applyTheme(theme, persist) {
    document.documentElement.setAttribute("data-theme", theme);
    document.documentElement.style.colorScheme = theme;
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute("content", theme === "light" ? "#f4efe5" : "#0d0d0f");
    if (persist) {
      try { localStorage.setItem(THEME_KEY, theme); } catch (e) {}
    }
    syncTheme();
  }
  function detectLang() {
    var supported = ["en", "zh", "ja"];
    var urlLang = new URLSearchParams(window.location.search).get("lang");
    if (supported.indexOf(urlLang) !== -1) return urlLang;
    try {
      for (var i = 0; i < 3; i++) {
        var key = ["preferredLanguage", "lang", "preferredLang"][i];
        var saved = localStorage.getItem(key);
        if (supported.indexOf(saved) !== -1) return saved;
      }
    } catch (e) {}
    var list = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || "en"];
    for (var j = 0; j < list.length; j++) {
      var base = String(list[j] || "").toLowerCase().split("-")[0];
      if (supported.indexOf(base) !== -1) return base;
    }
    return "en";
  }

  if (button) {
    button.addEventListener("click", function () {
      applyTheme(getTheme() === "light" ? "dark" : "light", true);
    });
  }

  if (window.matchMedia) {
    var mq = window.matchMedia("(prefers-color-scheme: dark)");
    var onChange = function (e) {
      try { if (localStorage.getItem(THEME_KEY)) return; } catch (err) {}
      applyTheme(e.matches ? "dark" : "light", false);
    };
    if (mq.addEventListener) mq.addEventListener("change", onChange);
    else if (mq.addListener) mq.addListener(onChange);
  }

  // Wrap the page's own apply() so the choice persists and the theme label follows it.
  if (typeof window.apply === "function") {
    var pageApply = window.apply;
    window.apply = function (lang) {
      pageApply(lang);
      try { localStorage.setItem(LANG_KEY, lang); } catch (e) {}
      syncTheme();
    };
    window.apply(pickLang());
  } else {
    syncTheme();
  }
})();
</script>

<style>

    align-items:center;
    justify-content:center;
    width:24px;
    height:24px;
    margin-left:7px;
    padding:0;
    background:transparent;
    border:1px solid transparent;
    border-radius:6px;
    color:var(--muted);
    cursor:pointer;
    vertical-align:middle;
    transition:color .15s ease,background .15s ease,border-color .15s ease;
  }
  .copy-id:hover{
    color:var(--accent);
    background:var(--accent-soft);
    border-color:var(--line);
  }
  .copy-id:focus-visible{
    outline:2px solid var(--accent);
    outline-offset:2px;
  }
  .copy-id svg{
    width:14px;
    height:14px;
    display:block;
    fill:none;
    stroke:currentColor;
    stroke-width:2;
    stroke-linecap:round;
    stroke-linejoin:round;
  }
  .copy-id .copy-ok{
    display:none;
    font-size:13px;
    line-height:1;
  }
  .copy-id.copied{
    color:var(--accent);
    background:var(--accent-soft);
    border-color:var(--accent);
  }
  .copy-id.copied svg{display:none}
  .copy-id.copied .copy-ok{display:inline}

  /* 手机：加大点击区域 */
  .ip-mask{
    padding:3px 2px;
    margin:-3px -2px;
  }
  @media (max-width:520px){
    .copy-id{
      width:32px;
      height:32px;
      margin-left:6px;
    }
    .copy-id svg{
      width:15px;
      height:15px;
    }
  }
</style>
<script>
(function () {
  'use strict';

  var LANG = (document.documentElement.lang || 'en').toLowerCase().slice(0, 2);
  var T = {
    en: { showIp: 'Click to show full IP', hideIp: 'Click to hide IP', copy: 'Copy Ray ID', copied: 'Copied' },
    zh: { showIp: '点击显示完整 IP', hideIp: '点击隐藏 IP', copy: '复制 Ray ID', copied: '已复制' },
    ja: { showIp: 'クリックでIPを表示', hideIp: 'クリックでIPを隠す', copy: 'Ray ID をコピー', copied: 'コピーしました' }
  };
  T = T[LANG] || T.en;

  /* ---------- 当前 IP：默认打码，点击展开 ---------- */
  var ipEl = document.getElementById('m-ip');

  function maskIp(ip) {
    if (!ip) return '';
    if (ip.indexOf(':') !== -1) {
      var g = ip.split(':');
      if (g.length > 2) return g.slice(0, g.length - 2).join(':') + ':xxxx:xxxx';
      return ip;
    }
    var p = ip.split('.');
    if (p.length === 4) return p[0] + '.' + p[1] + '.xxx.xxx';
    return ip;
  }

  var fullIp = '';
  var expanded = false;
  var lastText = '';

  function renderIp() {
    if (!ipEl) return;
    var text = fullIp ? (expanded ? fullIp : maskIp(fullIp)) : '';
    ipEl.textContent = text;
    lastText = text;
  }

  function setIp(value) {
    fullIp = value || '';
    expanded = false;
    renderIp();
  }

  if (ipEl) {
    ipEl.classList.add('ip-mask');
    ipEl.setAttribute('role', 'button');
    ipEl.setAttribute('tabindex', '0');
    ipEl.setAttribute('title', T.showIp);

    var toggleIp = function () {
      if (!fullIp) return;
      expanded = !expanded;
      renderIp();
      ipEl.setAttribute('title', expanded ? T.hideIp : T.showIp);
    };

    ipEl.addEventListener('click', toggleIp);
    ipEl.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        toggleIp();
      }
    });

    var syncIp = function () {
      if (!ipEl) return;
      var v = (ipEl.textContent || '').trim();
      if (!v) return;
      if (v.indexOf('::') !== -1) {
        if (v === lastText) return;
        fullIp = '';
        ipEl.textContent = '';
        lastText = '';
        return;
      }
      if (v === lastText) return;
      if (v === fullIp) {
        if (!expanded) renderIp();
        return;
      }
      setIp(v);
    };

    syncIp();

    var meta = document.getElementById('meta');
    if (meta && window.MutationObserver) {
      new MutationObserver(syncIp).observe(meta, {
        childList: true,
        characterData: true,
        subtree: true
      });
    }
  }

  /* ---------- Ray ID：一键复制 ---------- */
  var rayItem = document.getElementById('mi-ray');
  var rayEl = document.getElementById('m-ray');
  if (!rayItem || !rayEl) return;

  var btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'copy-id';
  btn.setAttribute('aria-label', T.copy);
  btn.title = T.copy;
  btn.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true">' +
    '<rect x="9" y="9" width="11" height="11" rx="2"></rect>' +
    '<path d="M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1"></path>' +
    '</svg><span class="copy-ok" aria-hidden="true">✓</span>';

  function markCopied() {
    btn.classList.add('copied');
    btn.title = T.copied;
    setTimeout(function () {
      btn.classList.remove('copied');
      btn.title = T.copy;
    }, 1400);
  }

  function fallbackCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.top = '-1000px';
    document.body.appendChild(ta);
    ta.select();
    try {
      document.execCommand('copy');
      markCopied();
    } catch (e) {}
    document.body.removeChild(ta);
  }

  btn.addEventListener('click', function () {
    var v = (rayEl.textContent || '').trim();
    if (!v || v.indexOf('::') !== -1) return;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(v).then(markCopied, function () {
        fallbackCopy(v);
      });
    } else {
      fallbackCopy(v);
    }
  });

  rayItem.appendChild(btn);
})();
</script>
</body>
</html>
